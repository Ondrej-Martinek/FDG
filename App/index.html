    let current = 0;
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function message(s) { return s.m ? `<p class="message">${esc(s.m)}</p>` : ''; }
    function cards(items) { return `<div class="cards">${items.map(item => `<div class="card">${esc(item)}</div>`).join('')}</div>`; }
    function reveal(s, classified=false) { return `<p class="question">${esc(s.q)}</p><div class="reveal"><button class="reveal-button">Zobrazit odpověď</button><div class="answer hidden" ${classified ? `style="border-color:${s.color};background:${s.color}18"` : ''}><b>${esc(s.a)}</b><p>${esc(s.e)}</p></div></div>${message(s)}`; }
    function content(s) {
      const standard = `<p class="kicker">${esc(sections[s.s])}</p><h2>${esc(s.t)}</h2>`;
      if (s.k === 'hero') return `<div class="slide hero"><p class="kicker" style="color:#8edcff">Finanční gramotnost · 2026</p><h2>${esc(s.t)}</h2><p>${esc(s.sub)}</p>${message(s)}</div>`;
      if (s.k === 'image') return `<div class="slide">${standard}<figure class="figure-frame"><img src="${esc(s.image)}" alt="${esc(s.alt || s.t)}"></figure>${s.caption ? `<p class="figure-caption">${esc(s.caption)}</p>` : ''}${message(s)}</div>`;
      if (s.k === 'profile') return `<div class="slide"><div class="image-row"><div>${standard}${s.sub ? `<p class="subtitle">${esc(s.sub)}</p>` : ''}<ul class="bullets">${s.cards.map(i => `<li>${esc(i)}</li>`).join('')}</ul>${message(s)}</div>${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.alt || s.t)}">` : ''}</div></div>`;
      if (s.k === 'poll') return `<div class="slide">${standard}<ol class="poll-options">${s.items.map(i => `<li><div><b>${esc(i[0])}</b>${i[1] ? `<span class="poll-quote">${esc(i[1])}</span>` : ''}</div></li>`).join('')}</ol>${message(s)}</div>`;
      if (s.k === 'question') return `<div class="slide">${standard}<p class="subtitle">${esc(s.sub)}</p>${cards(s.cards)}${message(s)}</div>`;
      if (s.k === 'reveal' || s.k === 'classify') return `<div class="slide">${standard}${reveal(s, s.k === 'classify')}</div>`;
      if (s.k === 'quote') return `<div class="slide"><div class="image-row"><div>${standard}<blockquote class="quote">${esc(s.quote)}</blockquote><p class="attribution">— ${esc(s.by)}</p>${message(s)}</div><img src="${esc(s.image)}" alt="Ilustrační fotografie"></div></div>`;
      if (s.k === 'embed') return `<div class="slide embed"><iframe src="${esc(s.src)}?embedded=1" title="${esc(s.t)}"></iframe></div>`;
      if (s.k === 'quadrants') return `<div class="slide">${standard}<div class="quadrants">${s.items.map(i => `<div class="quadrant" style="background:${i[3]}"><h3>${esc(i[0])}</h3><p>${esc(i[1])}</p><em>${esc(i[2])}</em></div>`).join('')}</div>${message(s)}</div>`;
      if (s.k === 'case') return `<div class="slide"><div class="image-row"><div>${standard}<p class="question">${esc(s.q)}</p></div><img src="${esc(s.image)}" alt="Mark Zuckerberg"></div><div class="reveal"><button class="reveal-button">Zobrazit možné důvody</button><div class="answer hidden">${cards(s.cards)}<p class="case-caveat">${esc(s.caveat)}</p></div></div>${message(s)}</div>`;
      if (s.k === 'story') return `<div class="slide">${standard}<div class="story">${s.items.map(i => `<div>${esc(i)}</div>`).join('')}</div>${message(s)}</div>`;
      if (s.k === 'checklist') return `<div class="slide">${standard}<ul class="checklist">${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>${message(s)}</div>`;
      if (s.k === 'glossary') return `<div class="slide">${standard}<div class="index">${s.items.map(i => `<span class="pill">${esc(i)}</span>`).join('')}</div>${message(s)}</div>`;
      if (s.k === 'takeaways') return `<div class="slide">${standard}<ol class="takeaways">${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>${message(s)}</div>`;
      if (s.k === 'sources') return `<div class="slide">${standard}<ul class="checklist">${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>${message(s)}</div>`;
      return '';
    }
    function renderNav() {
      const nav = $('navigation'); let html = ''; let previous = null;
      slides.forEach((slide, index) => { if (slide.s !== previous) { html += `<div class="nav-section">${esc(sections[slide.s])}</div>`; previous = slide.s; } html += `<button class="nav-item ${index === current ? 'active' : ''}" data-index="${index}">${esc(slide.n)}</button>`; });
      nav.innerHTML = html;
      nav.querySelectorAll('[data-index]').forEach(button => button.addEventListener('click', () => { current = Number(button.dataset.index); render(); $('sidebar').classList.remove('show'); }));
    }
    function render() {
      const s = slides[current];
      $('stage').innerHTML = `${content(s)}<span class="slide-number">${current + 1} / ${slides.length}</span>`;
      $('section-label').textContent = sections[s.s]; $('slide-name').textContent = s.n; $('counter').textContent = `${current + 1} / ${slides.length}`;
      $('progress').style.width = `${((current + 1) / slides.length) * 100}%`;
      $('previous').disabled = current === 0; $('next').disabled = current === slides.length - 1;
      $('stage').querySelectorAll('.reveal-button').forEach(button => button.addEventListener('click', () => { button.nextElementSibling.classList.remove('hidden'); button.classList.add('hidden'); }));
      renderNav();
    }
    function move(direction) { const next = current + direction; if (next >= 0 && next < slides.length) { current = next; render(); } }
    function setSidebarCollapsed(collapsed) {
      document.querySelector('.app').classList.toggle('sidebar-collapsed', collapsed);
      const toggle = $('sidebar-toggle');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.textContent = collapsed ? 'Zobrazit navigaci' : 'Skrýt navigaci';
    }
    $('previous').addEventListener('click', () => move(-1)); $('next').addEventListener('click', () => move(1));
    $('sidebar-toggle').addEventListener('click', () => setSidebarCollapsed(!document.querySelector('.app').classList.contains('sidebar-collapsed')));
    $('menu-button').addEventListener('click', () => $('sidebar').classList.toggle('show'));
    $('notes-button').addEventListener('click', () => { const s = slides[current]; const notes = s.notes?.length ? s.notes : ['Pro tento slide zatím nejsou samostatné poznámky.']; $('stage').insertAdjacentHTML('beforeend', `<aside class="notes"><h3>Poznámky řečníka · ${esc(s.n)}</h3><ul>${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul><button class="primary close-notes">Zavřít poznámky</button></aside>`); $('stage').querySelector('.close-notes').addEventListener('click', () => $('stage .notes').remove()); });
    document.addEventListener('keydown', event => { if (event.target.matches('input, textarea, select')) return; if (event.key === 'ArrowRight' || event.key === 'PageDown') move(1); if (event.key === 'ArrowLeft' || event.key === 'PageUp') move(-1); if (event.key.toLowerCase() === 'n') $('notes-button').click(); if (event.key === 'Escape') $('stage .notes')?.remove(); });
    render();
  </script>
