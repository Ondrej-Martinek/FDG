      source_refs: [Content/Topics/Diversification.md]
      content:
        type: stat_cards
        stats:
          - value: "4 %"
            label: "nejúspěšnějších akcií vytvořilo celý čistý přírůstek bohatství amerického trhu nad výnos státních pokladničních poukázek"
          - value: "~58 %"
            label: "akcií mělo za svou životnost nižší výnos než krátkodobé státní poukázky"
          - value: "96 %"
            label: "simulací náhodného výběru jediné akcie zaostalo za tržně váženým indexem (1926–2016)"
          - value: "73 %"
            label: "z těchto simulací zaostalo dokonce i za státními poukázkami"
        points:
          - "Dlouhodobé výnosy akcií jsou kladně zešikmené: ztráta je omezená na 100 % vkladu, zatímco výnos vítěze může být mnohonásobný."
          - "Mediánová výkonnost typické akcie proto může být slabá, i když index jako celek dlouhodobě roste — průměr táhnou extrémní vítězové."
          - "Tržně vážený index vítěze obsahuje, koncentrované portfolio jej naopak snadno mine."
          - "Nejde o to, že výběr akcií nemůže fungovat — jde o to, že spolehlivě překonat index je výrazně těžší, než se zdá."
        note: "Zdroj: Bessembinder (2018), Do Stocks Outperform Treasury Bills?, Journal of Financial Economics. Uvedené statistiky mají odlišné definice a jmenovatele."
        key_message: "Diverzifikace není jen obrana proti ztrátě — je to způsob, jak mít šanci zachytit vítěze, které dnes neumíme vybrat."
      interactions: []
      requires_fact_check:
        - "Přesné znění a jmenovatele statistik ze studie Bessembinder (2018)"

