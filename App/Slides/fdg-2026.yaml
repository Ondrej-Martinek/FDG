schema_version: "0.1-draft"

# Pracovní specifikace vytvořená ze storyboardu.
# Zdroj pravdy pro obsah zůstává v Content/ a Notes/; před publikací je nutné
# ověřit položky označené requires_fact_check.
presentation:
  id: fdg-2026
  title: "Finanční a digitální gramotnost"
  subtitle: "Jak přemýšlet o penězích, dluhu a investicích"
  language: cs
  audience:
    age: 17
    description: "Studenti sexty a septimy gymnázií a středních škol"
  duration_minutes: 100
  source_material:
    - medailonek.md
    - Content/motivace studentů.md
    - Content/Questions/questions.md
    - Content/Topics/
    - Content/Prakticky/
    - Content/Pojmy/
    - Notes/Pojmy, grafy, otázky.md

  theme:
    name: fdg-light
    background: "#FFFFFF"
    primary: "#005EB8"
    secondary: "#00A1DE"
    font: Inter
    navigation: left-sidebar
    interaction_pattern: "Nejdříve otázka; odpověď a vysvětlení až po aktivaci moderátorem."

  sections:
    - id: uvod
      label: Úvod
    - id: penize-a-inflace
      label: Peníze v čase
    - id: rozhodovani
      label: Jak přemýšlet o finančních rozhodnutích
    - id: dluh-a-paka
      label: Dluh a finanční páka
    - id: investovani
      label: Investování
    - id: prakticky
      label: Prakticky
    - id: zaver
      label: Závěr

  slides:
    - id: welcome
      order: 10
      section: uvod
      name: "FDG"
      title: "Peníze nejsou matematika. Jsou to rozhodnutí."
      goal: "Nastavit neformální, zvídavý tón přednášky."
      duration_minutes: 2
      content:
        type: hero
        subtitle: "O financích bez nudných pouček"
        key_message: "Dnes nepůjde o správné odpovědi nazpaměť, ale o způsob přemýšlení."
      assets: []
      interactions: []

    - id: presenter
      order: 20
      section: uvod
      name: "Něco o mě"
      title: "Ondřej Martínek"
      goal: "Říci něco o sobě bez dojmu náborové prezentace."
      duration_minutes: 2
      source_refs: [medailonek.md]
      content:
        type: profile
        role: "Datový analytik finančních trhů ČSOB"
        bullets:
          - "Zkušenost z investování a analýzy akcií"
          - "VŠE: finanční inženýrství; EDHEC Business School"
      assets:
        - type: image
          src: App/Assets/OM face.jpg
          alt: "Ondřej Martínek"
          role: portrait
      interactions: []

    - id: why-money-matters
      order: 30
      section: uvod
      name: "Proč finanční gramotnost"
      title: "Motivace studentů"
      goal: "Na začátku přednášky vydefinovat její cíle a povahu vzhledem k zájmům studentů."
      duration_minutes: 3
      source_refs: [Content/motivace studentů.md]
      content:
        type: poll
        options:
          - label: "Praktické finanční problémy a samostatnost"
            quote: "„Za chvíli budu dospělý a chci vědět, kde si založit účet nebo jak vybrat ETF.“"
          - label: "Investování a cesta k bohatství"
            quote: "„Chci vydělat peníze, ideálně je nechat vydělávat za sebe.“"
          - label: "Ekonomie a finance jako zájem, popř. budoucí kariéra"
            quote: "„Baví mě ekonomie, chci hlubší pochopení a uvažuji o VŠ ekonomického směru.“"
          - label: "Aktuální dění, technologie, AI"
            quote: "„Snažím se zorientovat v tom, co se děje ve světě a proč.“"
          - label: "Zábava"
            quote: "„Chtěl jsem se ulít z normálního vyučování.“"
      interactions:
        - type: hands_up_poll
          id: motivation_poll
          question: "Které téma byste si vybrali jako první?"

    - id: opener-losses
      order: 50
      section: penize-a-inflace
      name: "Rozcvička: 1"
      title: "Rozcvička 1: Procenta - zisky a ztráty"
      goal: "Vyvolat intuitivní chybu a otevřít téma násobení výnosů."
      duration_minutes: 3
      source_refs: [Content/Questions/questions.md]
      content:
        type: reveal_question
        question: "Mám portfolio o hodnotě 1 000 Kč. První rok vydělá 50 %, další rok ztratí 50 %. Kolik činí můj celkový výnos? Jsem v zisku nebo ve ztrátě?"
        reveal:
          answer: "750 Kč; celková ztráta je 25 %."
          explanation: "Druhé procento se počítá z vyšší částky 1 500 Kč, nikoli z původní tisícovky."
        key_message: "Je sleva 25% to samé jako +33% zdarma?"
      interactions:
        - type: manual_reveal
          id: opener_loss_answer
  

    - id: opener-compounding
      order: 60
      section: penize-a-inflace
      name: "Rozcvička: 2"
      title: "Rozcvička 2: Výnos (zase procenta...)"
      goal: "Připravit intuitivní základ pro složené úročení."
      duration_minutes: 3
      source_refs: [Content/Questions/questions.md]
      content:
        type: reveal_question
        question: "Portfolio má hodnotu 1 000 Kč. Dva roky po sobě vydělá 10 %. Jakou má na konci hodnotu?"
        reveal:
          answer: "1 210 Kč; celkové zhodnocení je 21 %."
          explanation: "Druhý výnos už je na širší bázi portfolia z prvního roku."
        key_message: "Výnos může vydělávat další výnos."
      interactions:
        - type: manual_reveal
          id: opener_compounding_answer

    - id: compound-intro
      order: 70
      section: penize-a-inflace
      name: "Složené úročení"
      title: "Složené úročení (compound interest)"
      goal: "Vysvětlit princip průběžného připisování výnosů."
      duration_minutes: 2
      source_refs: [Content/Topics/Compound-interest.md]
      content:
        type: quote_with_explanation
        quote: "Složené úročení je osmým divem světa."
        attribution: "A. Einstein, často citováno citováno také Warrenem Buffettem."
        key_message: "Včasný začátek, pravidelnost a dlouhý horizont mohou být důležitější než snaha trefit nejlepší okamžik."
      assets:
        - type: image
          src: App/Assets/Warren_Buffett_at_the_2015_SelectUSA_Investment_Summit.jpg
          alt: "Warren Buffett na konferenci"
          role: illustration
      interactions: []

    - id: compound-calculator
      order: 80
      section: penize-a-inflace
      name: "Interaktivní složené úročení"
      title: "Kolik může vyrůst pravidelná investice?"
      goal: "Nechat studenty prožít rozdíl mezi délkou, výnosem a pravidelným vkladem."
      duration_minutes: 6
      source_refs: [Content/Topics/Compound-interest.md]
      content:
        type: embedded_interactive
        embed: App/Assets/compound_interest.html
        key_message: "Model ukazuje princip, nikoli slib budoucího výnosu."
      interactions:
        - type: guided_experiment
          steps:
            - "Nechat třídu zvolit délku investování."
            - "Porovnat 2 000 Kč měsíčně při 3 % a 7 %."
            - "Ukázat, co se změní při zkrácení horizontu o deset let."

    - id: inflation-question
      order: 90
      section: penize-a-inflace
      name: "Otázka k inflaci"
      title: "Inflace"
      goal: "Oddělit změnu cenové hladiny od individuálního zdražení."
      duration_minutes: 3
      source_refs: [Content/Topics/Inflation.md, Notes/Pojmy, grafy, otázky.md]
      content:
        type: reveal_question
        question: "Co je inflace a proč nízkou inflaci centrální banky tolerují?"
        reveal:
          answer: "Pokles kupní síly peněz."
          explanation: "Nízká a předvídatelná inflace usnadňuje rozhodování, zatímco vysoká nebo nečekaná inflace ho komplikuje."
        key_message: "Ekonomové: Nominální a reálné veličiny (HDP, úroková sazba, výnos, ...)."
      interactions:
        - type: hands_up_poll
          id: inflation_definition
          question: "Kolik podle vás činí nyní meziroční inflace v ČR?"
      requires_fact_check:
        - "Aktuální meziroční inflace v ČR"

    - id: inflation-chart
      order: 100
      section: penize-a-inflace
      name: "Inflace a kupní síla"
      title: "Koruna nezmizí. Jen si za ni koupíte méně."
      goal: "Spojit historickou inflaci s dopadem na úspory."
      duration_minutes: 6
      source_refs: [Content/Topics/Inflation.md]
      content:
        type: embedded_interactive
        embed: App/Assets/inflace_cr_kupni_sila.html
        key_message: "Dlouhý horizont mění i zdánlivě malé roční tempo inflace v podstatný rozdíl."
      interactions:
        - type: guided_experiment
          steps:
            - "Nechat studenty vybrat rok, kdy se narodili."
            - "Porovnat kupní sílu 100 Kč tehdy a dnes."
            - "Ukázat inflační cíl a toleranční pásmo."
      requires_fact_check:
        - "Datová řada inflace a poslední rok v interaktivním grafu"

    - id: decision-categories
      order: 110
      section: rozhodovani
      name: "Čtyři kategorie"
      title: "Arbitráž, investice, spekulace, nebo černá díra?"
      goal: "Dát studentům jednoduchý rámec pro hodnocení finančních rozhodnutí."
      duration_minutes: 5
      source_refs: [Content/Questions/questions.md]
      content:
        type: four_quadrants
        items:
          - label: "Arbitráž"
            color: "#1976D2"
            definition: "Prakticky jistý zisk z cenového rozdílu při správném provedení."
            prompt: "Kde je bezpečně využitelný cenový rozdíl?"
          - label: "Investice"
            color: "#2E7D32"
            definition: "Aktivum vytváří hodnotu a pravděpodobně přinese budoucí výnos."
            prompt: "Co bude vytvářet můj budoucí výnos?"
          - label: "Spekulace"
            color: "#EF6C00"
            definition: "Sázka na budoucí vývoj s významnou nejistotou."
            prompt: "Na co přesně sázím?"
          - label: "Černá díra na peníze"
            color: "#C62828"
            definition: "Rozhodnutí s pravděpodobně zápornou očekávanou hodnotou."
            prompt: "Proč bych to měl dělat?"
        key_message: "Nálepka není vše: důležité jsou riziko, náklady, horizont a očekávaný zdroj výnosu."
      interactions: []

    - id: classify-arbitrage
      order: 120
      section: rozhodovani
      name: "Rychlá otázka: arbitráž"
      title: "Stejné akcie, dvě ceny"
      goal: "Ukázat podstatu arbitráže a její praktická omezení."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Stejná akcie stojí na jedné burze 10 EUR a na jiné 100 Kč. Co udělám?"
        reveal:
          category: arbitráž
          color: "#1976D2"
          explanation: "Jen tehdy, pokud lze obě transakce provést současně a rozdíl nepohltí kurz, poplatky, daně, likvidita nebo riziko vypořádání."
        key_message: "Zdánlivě jistý zisk často zmizí po započtení nákladů a omezení."
      interactions:
        - type: manual_reveal
          id: classify_arbitrage_answer

    - id: classify-resale
      order: 130
      section: rozhodovani
      name: "Rychlá otázka: přeprodej"
      title: "Sleva v e-shopu, vyšší cena na Vinted"
      goal: "Přenést princip cenového rozdílu do běžného života."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Koupím nový batoh za 1 000 Kč ve slevě; na Vinted se prodává za 2 000 Kč. Co to je?"
        reveal:
          category: "podmíněná arbitráž"
          color: "#1976D2"
          explanation: "Je třeba ověřit, že jde o stejné zboží, existuje kupující a náklady, čas i riziko vrácení nepohltí marži."
        key_message: "Příležitost vzniká z rozdílu cen, ale není automaticky bez rizika."
      interactions:
        - type: manual_reveal
          id: classify_resale_answer

    - id: classify-etf
      order: 140
      section: rozhodovani
      name: "Rychlá otázka: ETF"
      title: "Kupuji ETF na světové akcie"
      goal: "Popsat, proč může diverzifikované akciové ETF dávat ekonomický smysl."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md, Content/Prakticky/ETF.md]
      content:
        type: classify_reveal
        scenario: "Pravidelně kupuji levné ETF na široký akciový index s dlouhým horizontem."
        reveal:
          category: investice
          color: "#2E7D32"
          explanation: "Investor vlastní podíly ve firmách, které produkují výrobky a služby; výnos ovšem není jistý ani rovnoměrný."
        key_message: "Investice není garance zisku; stojí na rozumně vysvětleném zdroji budoucí hodnoty."
      interactions:
        - type: manual_reveal
          id: classify_etf_answer

    - id: classify-human-capital
      order: 150
      section: rozhodovani
      name: "Rychlá otázka: vzdělání"
      title: "Kurz Pythonu za 1 000 Kč"
      goal: "Rozšířit pojem investice i mimo finanční trhy."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Zaplatím kurz Pythonu, protože mi může otevřít lépe placenou práci."
        reveal:
          category: "investice do lidského kapitálu"
          color: "#2E7D32"
          explanation: "Budoucí výnos není jistý, ale vzniká konkrétní dovednost, která může zvýšit možnosti a příjmy."
        key_message: "Jedna z nejvýnosnějších investic může být do vlastních schopností."
      interactions:
        - type: manual_reveal
          id: classify_human_capital_answer

    - id: classify-bitcoin
      order: 160
      section: rozhodovani
      name: "Rychlá otázka: spekulace"
      title: "Bitcoin už přece nemůže spadnout níž"
      goal: "Rozlišit přesvědčení o budoucí ceně od zdroje hodnoty."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Vsadím 1 000 Kč na růst bitcoinu během týdne, protože už nemůže spadnout níž."
        reveal:
          category: spekulace
          color: "#EF6C00"
          explanation: "Výsledek závisí hlavně na krátkodobém pohybu ceny, který nelze spolehlivě odvodit z věty 'už nemůže klesat'."
        key_message: "Spekulace nemusí být zakázaná, ale musí být pojmenovaná a omezená."
      interactions:
        - type: manual_reveal
          id: classify_bitcoin_answer

    - id: classify-nvidia
      order: 170
      section: rozhodovani
      name: "Rychlá otázka: horká akcie"
      title: "Koupím jednu akcii, protože AI mění svět"
      goal: "Ukázat koncentraci a příběhové riziko jednotlivé akcie."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Koupím jedinou akcii, protože kamarád říká, že AI všechno změní."
        reveal:
          category: spekulace
          color: "#EF6C00"
          explanation: "Může jít o skvělou firmu, ale jedna informace ani popularita tématu neřeší cenu akcie, diverzifikaci ani riziko omylu."
        key_message: "Dobrá technologie a dobrá investice nejsou automaticky totéž."
      interactions:
        - type: manual_reveal
          id: classify_single_stock_answer

    - id: classify-roulette
      order: 180
      section: rozhodovani
      name: "Rychlá otázka: ruleta"
      title: "Kasino a ruleta"
      goal: "Pojmenovat zápornou očekávanou hodnotu."
      duration_minutes: 2
      source_refs: [Content/Questions/questions.md]
      content:
        type: classify_reveal
        scenario: "Zaplatím vstup do kasina a hraji ruletu, abych vydělal peníze."
        reveal:
          category: "černá díra na peníze"
          color: "#C62828"
          explanation: "Kasino má matematickou výhodu. Krátkodobě lze vyhrát, ale dlouhodobé očekávání hráče je záporné."
        key_message: "Zábava může stát peníze; není to investiční strategie."
      interactions:
        - type: manual_reveal
          id: classify_roulette_answer

    - id: zuckerberg-intro
      order: 181
      section: dluh-a-paka
      name: "M. Zuckerberg"
      title: "M. Zuckerberg"
      goal: "Připravit půdu pro otázku: nechat studenty hádat, o čem bude řeč."
      duration_minutes: 2
      source_refs: [Content/Topics/Zuckerberg.md]
      content:
        type: image_only
      assets:
        - type: image
          src: App/Assets/MarkZuckerberg.png
          alt: "Mark Zuckerberg"
          role: illustration
      interactions: []

    - id: zuckerberg-mortgage
      order: 182
      section: dluh-a-paka
      name: "Zuckerbergova hypotéka"
      title: "Proč si velmi bohatý člověk bere hypotéku?"
      goal: "Prověřit porozumění záporné reálné sazbě, likviditě a nákladům příležitosti."
      duration_minutes: 7
      source_refs: [Content/Topics/Zuckerberg.md, Content/Pojmy/Dluh.md]
      content:
        type: case_study_reveal
        prompt: "Proč by člověk s velkým majetkem neplatil dům jednoduše v hotovosti?"
        reveal:
          reasons:
            - "Nízká nominální sazba může po inflaci znamenat levné financování."
            - "Likvidita může zůstat k dispozici pro jiné použití."
            - "Peníze mohou mít jinde vyšší očekávaný výnos, ovšem s rizikem."
          caveat: "Výnos jinde není jistý a daňové důsledky závisí na zemi i konkrétní situaci."
        key_message: "Dluh se hodnotí podle ceny, účelu, rizika a schopnosti splácet — ne podle samotné existence."
      assets:
        - type: image
          src: App/Assets/Zuckerberguv_dum_6M.jpg
          alt: "Moderní luxusní dům (ilustrační fotografie)"
          role: illustration
      interactions:
        - type: think_pair_share
          id: zuckerberg_reasoning
          prompt: "Vymyslete ve dvojici dva rozumné důvody a jedno riziko."
      requires_fact_check:
        - "Parametry konkrétní Zuckerbergovy hypotéky"
        - "Daňové tvrzení; nelze přenášet americká pravidla na české studenty"

    - id: leverage-quote
      order: 190
      section: dluh-a-paka
      name: "Úvod k páce"
      title: "Dluh: dobrý sluha, zlý pán"
      goal: "Otevřít téma páky bez moralizování."
      duration_minutes: 2
      source_refs: [Content/Topics/Financial-leverage.md, Content/Pojmy/Dluh.md]
      content:
        type: quote_with_explanation
        quote: "Jsou jen tři způsoby, jak chytrý člověk může zchudnout: ladies, liquor, leverage."
        attribution: Warren Buffett
        key_message: "Dluh zvětšuje rozsah výsledku: pomáhá při růstu, škodí při poklesu nebo vysokém úroku."
      assets:
        - type: image
          src: App/Assets/Warren_Buffett_at_the_2015_SelectUSA_Investment_Summit.jpg
          alt: "Názorné vysvětlení finanční páky"
          role: illustration
      interactions: []

    - id: leverage-calculator
      order: 200
      section: dluh-a-paka
      name: "Interaktivní finanční páka"
      title: "Co udělá dluh s ročním výsledkem?"
      goal: "Ukázat, že úrok a výnos aktiv společně určují dopad páky."
      duration_minutes: 7
      source_refs: [Content/Topics/Financial-leverage.md]
      content:
        type: embedded_interactive
        embed: App/Assets/financni_paka_interaktivni.html
        key_message: "Páka nezvyšuje kvalitu investice; zvyšuje velikost jejího dopadu na vlastní kapitál."
      interactions:
        - type: guided_experiment
          steps:
            - "Spustit scénář růstu +10 %."
            - "Přepnout na pokles −10 % se stejným dluhem."
            - "Nastavit nulový dluh a porovnat výsledek."

    - id: leverage-picture
      order: 205
      section: dluh-a-paka
      name: "Finanční páka názorně"
      title: "Dluh: dobrý sluha, zlý pán"
      goal: "Vysvětlit princip páky názorně na obrázku."
      duration_minutes: 1
      source_refs: [Content/Topics/Financial-leverage.md, Content/Pojmy/Dluh.md]
      content:
        type: image
        caption: "Páka zvětšuje jak zisk, tak ztrátu — záleží na výnosu aktiv versus nákladu dluhu."
        key_message: "Dluh sám o sobě není dobrý ani špatný; rozhoduje cena, účel a riziko."
      assets:
        - type: image
          src: App/Assets/FinančníPáka-jednoduchá.png
          alt: "Názorné vysvětlení finanční páky"
          role: illustration
      interactions: []

    - id: diversification
      order: 220
      section: investovani
      name: "Diverzifikace"
      title: "Největší vítěz trhu může být firma, kterou jste nekoupili"
      goal: "Vysvětlit diverzifikaci jako ochranu před vynecháním mimořádných vítězů i před ztrátou."
      duration_minutes: 7
      source_refs: [Content/Topics/Diversification.md]
      content:
        type: narrative
        beats:
          - "Pár mimořádně úspěšných firem může táhnout výnos celého indexu."
          - "Při výběru několika akcií je snadné takové firmy minout."
