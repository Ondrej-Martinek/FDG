FDF slidy - tento yaml generuej AI na základě markdown souborů.

presentation:
  id: financial-literacy-2026
  title: "Finanční a digitální gramotnost"
  subtitle: "Jak přemýšlet o penězích, dluhu a investicích"
  language: cs
  audience:
    age: 17
    description: "Studenti sexty a septimy"
  duration_minutes: 100

  theme:
    name: modern-dark
    accent: "#66D9A8"
    font: "Inter"

  slides:
    - id: opening
      order: 10
      section: uvod
      name: "Úvodní slide"
      title: "Co kdyby vám zítra přišlo 100 000 Kč?"
      goal: "Vzbudit zájem a otevřít téma finančního rozhodování."
      duration_minutes: 3

      content:
        type: question
        subtitle: "Co byste s penězi udělali jako první?"
        bullets: []
        key_message: null

      assets:
        - type: image
          src: "assets/money.jpg"
          alt: "Bankovky a mince"
          role: background

      interactions:
        - type: poll
          id: opening_poll
          question: "Jak byste peníze využili?"
          options:
            - "Utratil bych je"
            - "Nechal bych je na účtu"
            - "Začal bych investovat"
            - "Rozdělil bych je mezi více možností"

      speaker_notes:
        - "Nechat studenty hlasovat bez komentáře k tomu, která odpověď je správná."
        - "K tématu se vrátit na konci přednášky."

    - id: inflation_basics
      order: 20
      section: penize_a_inflace
      name: "Kupní síla peněz"
      title: "Za stejné peníze si koupíte méně"
      goal: "Vysvětlit rozdíl mezi nominální hodnotou peněz a jejich kupní silou."
      duration_minutes: 5

      content:
        type: interactive_chart
        subtitle: "Jak inflace mění hodnotu úspor v čase"
        key_message: "Rozhoduje, co si za peníze skutečně koupíme."

      assets: []

      visualization:
        type: line
        title: "Vývoj kupní síly"
        data:
          initial_amount: 100000
          annual_inflation: 0.03
          years: 20
        controls:
          - id: annual_inflation
            type: slider
            label: "Roční inflace"
            min: 0
            max: 0.15
            step: 0.01
            default: 0.03

      interactions: []

      speaker_notes:
        - "Nejdříve se zeptat, co znamená inflace."
        - "Zdůraznit, že nominální zůstatek na účtu může zůstat stejný, ale kupní síla klesá."

    - id: debt_paradox
      order: 30
      section: dluh
      name: "Dluh není vždy špatný"
      title: "Proč si bohatí lidé půjčují?"
      goal: "Ukázat, že hodnocení dluhu závisí na jeho ceně, účelu a riziku."
      duration_minutes: 7

      content:
        type: comparison
        subtitle: "Spotřební dluh versus financování aktiva"
        key_message: "Rozhoduje ekonomika celého rozhodnutí, nikoli samotná existence dluhu."

      assets:
        - type: image
          src: "assets/house.jpg"
          alt: "Rodinný dům"
          role: illustration

      visualization:
        type: calculator
        title: "Model financování nemovitosti"
        inputs:
          - id: loan_amount
            label: "Výše úvěru"
            type: number
            default: 8000000
          - id: annual_rate
            label: "Roční úroková sazba"
            type: percentage
            default: 0.045
          - id: term_years
            label: "Doba splácení v letech"
            type: number
            default: 30
        outputs:
          - monthly_payment
          - total_interest

      interactions: []

      speaker_notes:
        - "Vysvětlit rozdíl mezi produktivním a spotřebním využitím dluhu."
        - "Upozornit, že růst ceny aktiva není garantovaný."

